name: Sauvegarde quotidienne de la base

on:
  schedule:
    # Tous les jours à 01:00 UTC (02:00 au Bénin)
    - cron: "0 1 * * *"
  workflow_dispatch: # permet aussi de lancer la sauvegarde à la main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le client PostgreSQL 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Sauvegarder la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: backups
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      - name: Conserver la sauvegarde (30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: wadacces-backup-${{ github.run_number }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error
