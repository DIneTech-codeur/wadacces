name: Sauvegarde quotidienne de la base

on:
  schedule:
    # Tous les jours à 02:00 UTC (02:00 à Dakar)
    - cron: "0 2 * * *"
  workflow_dispatch: # permet aussi de lancer la sauvegarde à la main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le client PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Sauvegarder la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: backups
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      - name: Conserver la sauvegarde (30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: wadacces-backup-${{ github.run_number }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error
